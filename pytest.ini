[tool:pytest]
# pytest配置文件
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 自定义标记
markers =
    unit: 单元测试
    asyncio: 异步测试
    integration: 集成测试
    performance: 性能测试
    slow: 慢速测试

# 异步配置
asyncio_mode = auto

# 覆盖率配置
addopts =
    --strict-markers
    --disable-warnings
    --tb=short