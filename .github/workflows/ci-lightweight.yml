name: 轻量级CI测试

on:
  push:
    branches: [main, bwx_dev, develop, feature/*]
  pull_request:
    branches: [main]

jobs:
  # 单元测试 (无数据库依赖)
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]  # 只测试一个版本加快速度

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: 缓存依赖
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock pytest-cov black flake8

      - name: 代码风格检查
        run: |
          black --check .
          flake8 . --max-line-length=88 --extend-ignore=E203

      - name: 运行轻量级单元测试
        run: |
          # 只运行不需要真实数据库的测试
          pytest tests/ -m "unit and not database" --cov=wxkf_saas --cov-report=xml --tb=short

      - name: 运行Mock测试
        run: |
          # 运行使用Mock的数据库测试
          pytest tests/ -m "unit and database" --cov=wxkf_saas --cov-append --cov-report=xml --tb=short

      - name: 上传覆盖率
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # 集成测试 (使用SQLite)
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-mock aiosqlite

      - name: 运行SQLite集成测试
        run: |
          # 使用SQLite内存数据库进行集成测试
          pytest tests/ -m "integration" --tb=short --db-type=sqlite
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          TEST_DB_TYPE: sqlite

  # 基础功能验证
  basic-functionality:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 验证应用启动
        run: |
          # 验证应用能正常启动(不连接数据库)
          python -c "
          from core.config import WxKfSaasConfig
          from core.client import WxKfSaasClient
          print('✅ 应用基础功能正常')
          "

      - name: 验证模型定义
        run: |
          python -c "
          from models.tenant import Tenant
          from models.message import Message
          from models.kf_account import KfAccount
          print('✅ 数据模型定义正常')
          "

      - name: 验证API路由
        run: |
          python -c "
          from api.kf_account import router as kf_router
          from api.message import router as msg_router
          from api.media import router as media_router
          print('✅ API路由定义正常')
          "