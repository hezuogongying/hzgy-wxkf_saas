name: Sync to Gitee

on:
  push:
    branches:
      - bwx_dev
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
        with:
          source-repo: git@github.com:hezuogongying/hzgy-wxkf_saas.git
          destination-repo: git@gitee.com:hezuogongying/wxkf_saas.git
