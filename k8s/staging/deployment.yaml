apiVersion: apps/v1
kind: Deployment
metadata:
  name: wxkf-staging
  namespace: wxkf-staging
  labels:
    app: wxkf-staging
    version: ${IMAGE_TAG}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wxkf-staging
  template:
    metadata:
      labels:
        app: wxkf-staging
        version: ${IMAGE_TAG}
    spec:
      containers:
      - name: wxkf-staging
        image: ${IMAGE_URL}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: FASTAPI_HOST
          value: "0.0.0.0"
        - name: FASTAPI_PORT
          value: "8083"
        - name: LOG_LEVEL
          value: "INFO"

        # 数据库配置
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: db-password

        # Redis配置
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: redis-password

        # 微信配置
        - name: SUITE_ID
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: suite-id
        - name: SUITE_SECRET
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: suite-secret
        - name: PROVIDER_SECRET
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: provider-secret
        - name: PROVIDER_TOKEN
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: provider-token
        - name: PROVIDER_ENCODING_AES_KEY
          valueFrom:
            secretKeyRef:
              name: wxkf-staging-secrets
              key: provider-encoding-aes-key

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

      imagePullSecrets:
      - name: ghcr-secret

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000