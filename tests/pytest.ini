[tool:pytest]
minversion = 6.0
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=wxkf_saas
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
    --cov-branch
    --cov-branch-min-coverage=80
    --cov-exclude
        .env
        .venv
        */test_scripts/*
        */tests/*
    --cov-include
        wxkf_saas/*
    --cov-html=htmlcov
    --durations=10
    --durations-min=0.1
    --last-failed=10
    --instafail

markers =
    unit: 单元测试
    integration: 集成测试
    performance: 性能测试
    asyncio: 异步测试
    slow: 慢速测试标记
    slow_threshold: 1.0

testpaths =
    tests/
    wxkf_saas/

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

asyncio_mode = auto